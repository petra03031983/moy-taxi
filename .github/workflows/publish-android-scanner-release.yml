name: Publish Astana Guide Scanner APK

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-android-scanner-release.yml"
      - "android/**"
      - "src/app/api/road-screen-evidence/route.js"
      - "src/app/astana-map/page.js"
      - "supabase/migrations/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build scanner APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Prepare APK for release
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Astana-Guide-Scanner-Icons-AI-v1.4.7.apk

      - name: Publish downloadable APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: astana-guide-screen-icons-1.4.7-mobile
          name: "Астана Гид — сканер значков 1.4.7"
          body: |
            Установочный APK для Android.

            Пакет: kz.astanaguide.scanner.icons144
            Версия приложения: 1.4.7 (fix HTTP 401, recover pending local icon queue, strict OCR filtering, structured GPS/direction fields).

            Скачайте файл Astana-Guide-Scanner-Icons-AI-v1.4.6.apk и откройте его на телефоне.
          files: Astana-Guide-Scanner-Icons-AI-v1.4.6.apk
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          make_latest: true
