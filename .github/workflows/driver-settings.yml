name: Apply driver settings

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch driver settings
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('src/app/page.js')
          s = p.read_text(encoding='utf-8')
          if 'data-moy-taxi-settings-v2' in s:
              print('Already patched')
              raise SystemExit(0)
          old = '[lineSwitchBusy,setLineSwitchBusy]=useState(false),[driverMenuOpen,setDriverMenuOpen]=useState(false);'
          new = old[:-1] + ',[settingsTab,setSettingsTab]=useState("orders"),[darkMode,setDarkMode]=useState("system"),[feedSounds,setFeedSounds]=useState(false),[orderChain,setOrderChain]=useState(false),[quickSwitch,setQuickSwitch]=useState(false),[navigatorApp,setNavigatorApp]=useState("2gis"),[filterMinPrice,setFilterMinPrice]=useState(""),[filterMaxDistance,setFilterMaxDistance]=useState(""),[filterVehicleClass,setFilterVehicleClass]=useState("all"),[filterTripType,setFilterTripType]=useState("all"),[tariffs,setTariffs]=useState({economy:120,comfort:150,comfort_plus:180,business:250,minivan:220,premium:300});'
          if old not in s: raise SystemExit('state marker not found')
          s = s.replace(old, new, 1)
          marker = ' async function auth(e){'
          effect = ''' useEffect(()=>{\n  try{\n   const raw=localStorage.getItem("moyTaxiDriverSettings");\n   if(raw){const x=JSON.parse(raw);setDarkMode(x.darkMode||"system");setFeedSounds(Boolean(x.feedSounds));setOrderChain(Boolean(x.orderChain));setQuickSwitch(Boolean(x.quickSwitch));setNavigatorApp(x.navigatorApp||"2gis");setFilterMinPrice(x.filterMinPrice||"");setFilterMaxDistance(x.filterMaxDistance||"");setFilterVehicleClass(x.filterVehicleClass||"all");setFilterTripType(x.filterTripType||"all");setTariffs(x.tariffs||{economy:120,comfort:150,comfort_plus:180,business:250,minivan:220,premium:300})}\n  }catch{}\n },[]);\n useEffect(()=>{try{localStorage.setItem("moyTaxiDriverSettings",JSON.stringify({darkMode,feedSounds,orderChain,quickSwitch,navigatorApp,filterMinPrice,filterMaxDistance,filterVehicleClass,filterTripType,tariffs}))}catch{}},[darkMode,feedSounds,orderChain,quickSwitch,navigatorApp,filterMinPrice,filterMaxDistance,filterVehicleClass,filterTripType,tariffs]);\n function navigationRoute(lat,lng,address){\n  const app=(()=>{try{return localStorage.getItem("moyTaxiNavigator")||navigatorApp}catch{return navigatorApp}})();\n  if(app==="google"&&Number.isFinite(Number(lat))&&Number.isFinite(Number(lng)))return `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}&travelmode=driving`;\n  if(app==="yandex"&&Number.isFinite(Number(lat))&&Number.isFinite(Number(lng)))return `https://yandex.ru/maps/?rtext=~${lat},${lng}&rtt=auto`;\n  return twoGisRoute(lat,lng,address);\n }\n function saveDriverSettings(){try{localStorage.setItem("moyTaxiDriverSettings",JSON.stringify({darkMode,feedSounds,orderChain,quickSwitch,navigatorApp,filterMinPrice,filterMaxDistance,filterVehicleClass,filterTripType,tariffs}));localStorage.setItem("moyTaxiNavigator",navigatorApp);setNotice("Настройки сохранены.")}catch{setNotice("Настройки применены на этом телефоне.")}}\n'''
          if marker not in s: raise SystemExit('auth marker not found')
          s = s.replace(marker, effect + marker, 1)
          s = s.replace('window.setTimeout(ding,index*650);', 'if(feedSounds)window.setTimeout(ding,index*650);', 1)
          s = s.replace('if(navigator.vibrate)navigator.vibrate(fresh.length>1?[250,100,250,100,250]:[250,100,250]);', 'if(feedSounds&&navigator.vibrate)navigator.vibrate(fresh.length>1?[250,100,250,100,250]:[250,100,250]);', 1)
          s = s.replace('const visibleOrders=tab==="active"?orders.filter(o=>["accepted","arrived","client_ready","started"].includes(o.status)):orders;', 'const filteredOrders=orders.filter(o=>(!filterMinPrice||Number(o.agreed_price||o.client_price||o.driver_price||0)>=Number(filterMinPrice))&&(!filterMaxDistance||o.distance_km==null||Number(o.distance_km)<=Number(filterMaxDistance))&&(filterVehicleClass==="all"||o.vehicle_class===filterVehicleClass)&&(filterTripType==="all"||o.trip_type===filterTripType));\n const visibleOrders=tab==="active"?filteredOrders.filter(o=>["accepted","arrived","client_ready","started"].includes(o.status)):filteredOrders;')
          s = s.replace('href={twoGisRoute(', 'href={navigationRoute(')
          s = s.replace('mapTab.location.href=twoGisRoute(', 'mapTab.location.href=navigationRoute(')
          old_settings = re.compile(r'\{tab==="settings"&&<section className="panel driver-utility-panel">.*?</section>\}\{tab==="support"', re.S)
          new_settings = '''{tab==="settings"&&<section className="panel driver-utility-panel driver-settings-page" data-moy-taxi-settings-v2>\n <div className="driver-settings-header"><button type="button" className="driver-settings-back" onClick={()=>setTab("orders")}>‹</button><h2>Настройки</h2><span></span></div>\n <div className="driver-settings-tabs"><button type="button" className={settingsTab==="tariffs"?"active":""} onClick={()=>setSettingsTab("tariffs")}>Тарифы</button><button type="button" className={settingsTab==="orders"?"active":""} onClick={()=>setSettingsTab("orders")}>Заказы</button></div>\n {settingsTab==="orders"&&<div className="driver-settings-body">\n  <button type="button" className="driver-settings-row driver-settings-link" onClick={()=>setNotice("Фильтр применён к ленте заказов.")}><span className="driver-settings-icon">▣</span><span><b>Фильтр входящих заказов</b><small>Минимальная цена, расстояние и класс автомобиля</small></span><span>›</span></button>\n  <div className="driver-settings-filter-card"><div className="field"><label>Минимальная цена, ₸</label><input inputMode="numeric" type="number" min="0" value={filterMinPrice} onChange={e=>setFilterMinPrice(e.target.value)} placeholder="Без ограничения"/></div><div className="field"><label>Максимальное расстояние до подачи, км</label><input inputMode="decimal" type="number" min="0" step="0.5" value={filterMaxDistance} onChange={e=>setFilterMaxDistance(e.target.value)} placeholder="25"/></div><div className="field"><label>Класс</label><select value={filterVehicleClass} onChange={e=>setFilterVehicleClass(e.target.value)}><option value="all">Все классы</option>{VEHICLE_CLASSES.map(([id,label])=><option key={id} value={id}>{label}</option>)}</select></div><div className="field"><label>Тип поездки</label><select value={filterTripType} onChange={e=>setFilterTripType(e.target.value)}><option value="all">Город + Межгород</option><option value="city">Город</option><option value="intercity">Межгород</option></select></div></div>\n  <div className="driver-settings-title">Тёмный режим</div><div className="driver-settings-choice"><button type="button" className={darkMode==="off"?"active":""} onClick={()=>setDarkMode("off")}>Выкл.</button><button type="button" className={darkMode==="dark"?"active":""} onClick={()=>setDarkMode("dark")}>Вкл.</button><button type="button" className={darkMode==="system"?"active":""} onClick={()=>setDarkMode("system")}>Как в системе</button></div>\n  <div className="driver-settings-row"><span className="driver-settings-icon">♧</span><span><b>Звуки в ленте заказов</b><small>Получать звуковой сигнал о новых заказах</small></span><button type="button" className={"driver-settings-toggle "+(feedSounds?"on":"")} onClick={()=>setFeedSounds(v=>!v)}><i></i></button></div>\n  <div className="driver-settings-row"><span className="driver-settings-icon">▷</span><span><b>Цепочка заказов</b><small>После завершения поездки оставаться на линии и сразу видеть следующие заказы</small></span><button type="button" className={"driver-settings-toggle "+(orderChain?"on":"")} onClick={()=>setOrderChain(v=>!v)}><i></i></button></div>\n  <div className="driver-settings-row"><span className="driver-settings-icon">↗</span><span><b>Кнопка быстрого перехода</b><small>Показывать быстрый переход к ленте заказов</small></span><button type="button" className={"driver-settings-toggle "+(quickSwitch?"on":"")} onClick={()=>setQuickSwitch(v=>!v)}><i></i></button></div>\n  <button type="button" className="driver-settings-row driver-settings-link" onClick={()=>{const next=navigatorApp==="2gis"?"yandex":navigatorApp==="yandex"?"google":"2gis";setNavigatorApp(next);try{localStorage.setItem("moyTaxiNavigator",next)}catch{}}}><span className="driver-settings-icon">➤</span><span><b>Навигатор</b><small>{navigatorApp==="2gis"?"2GIS":navigatorApp==="yandex"?"Яндекс Навигатор":"Google Maps"}</small></span><span>›</span></button>\n  <button type="button" className="button primary driver-settings-save" onClick={saveDriverSettings}>Сохранить настройки</button>\n </div>}\n {settingsTab==="tariffs"&&<div className="driver-settings-body"><div className="driver-settings-title">Тарифы по классам</div><p className="muted small">Базовая ставка за 1 км. Значения сохраняются на этом телефоне.</p><div className="driver-tariff-list">{VEHICLE_CLASSES.map(([id,label])=><div className="driver-tariff-row" key={id}><span>{label}</span><div><input inputMode="numeric" type="number" min="0" value={tariffs[id]??0} onChange={e=>setTariffs(t=>({...t,[id]:e.target.value}))}/><b>₸/км</b></div></div>)}</div><button type="button" className="button primary driver-settings-save" onClick={saveDriverSettings}>Сохранить тарифы</button></div>}\n </section>}{tab==="support"'''
          s2, n = old_settings.subn(new_settings, s, count=1)
          if n != 1: raise SystemExit('settings block not found')
          s = s2
          s = s.replace('</nav></main>;', '<nav></nav></main>;') if False else s
          s = s.replace('</nav></main>;', '</nav> <button type="button" className="driver-quick-switch" onClick={()=>setTab("orders")} aria-label="Быстрый переход к заказам">↗ Заказы</button></main>;', 1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Add settings styles
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/app/globals.css')
          s=p.read_text(encoding='utf-8')
          if '/* MOY TAXI DRIVER SETTINGS V2 */' in s: raise SystemExit(0)
          css='''\n/* MOY TAXI DRIVER SETTINGS V2 */\n.driver-settings-page{padding:0;overflow:hidden;background:#fff;color:#151515}.driver-settings-header{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:18px 18px 10px}.driver-settings-header h2{margin:0;text-align:center;font-size:23px}.driver-settings-back{border:0;background:transparent;font-size:38px;line-height:1;padding:0;cursor:pointer;color:inherit}.driver-settings-tabs{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid #ddd}.driver-settings-tabs button{border:0;background:transparent;padding:16px 8px;font-size:17px;font-weight:800;border-bottom:3px solid transparent;color:inherit}.driver-settings-tabs button.active{border-bottom-color:#111}.driver-settings-body{padding:0 18px 24px}.driver-settings-row{width:100%;min-height:76px;display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;border:0;border-bottom:1px solid #eee;background:transparent;text-align:left;color:inherit}.driver-settings-row span:nth-child(2){display:flex;flex-direction:column;gap:5px}.driver-settings-row b{font-size:17px}.driver-settings-row small{font-size:13px;line-height:1.35;color:#777}.driver-settings-icon{font-size:29px;text-align:center}.driver-settings-link{cursor:pointer}.driver-settings-title{font-size:18px;font-weight:800;margin:22px 0 12px}.driver-settings-choice{display:grid;grid-template-columns:1fr 1fr 1.45fr;gap:8px;margin-bottom:8px}.driver-settings-choice button{border:0;border-radius:28px;padding:12px 8px;background:#f0efeb;font-weight:800;font-size:15px}.driver-settings-choice button.active{background:#171717;color:#fff}.driver-settings-toggle{width:64px;height:38px;border:0;border-radius:24px;background:#efeee9;padding:4px;cursor:pointer}.driver-settings-toggle i{display:block;width:30px;height:30px;border-radius:50%;background:#fff;box-shadow:0 1px 4px #aaa;transition:transform .2s}.driver-settings-toggle.on{background:#111}.driver-settings-toggle.on i{transform:translateX(26px)}.driver-settings-filter-card{background:#f7f6f2;border-radius:18px;padding:12px 14px;margin-top:8px}.driver-settings-filter-card .field{margin-bottom:10px}.driver-settings-filter-card .field:last-child{margin-bottom:0}.driver-settings-filter-card label{font-size:13px}.driver-settings-filter-card input,.driver-settings-filter-card select,.driver-tariff-row input{width:100%;box-sizing:border-box}.driver-settings-save{width:100%;margin-top:18px}.driver-tariff-list{display:grid;gap:8px}.driver-tariff-row{display:grid;grid-template-columns:1fr 125px;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #eee;font-weight:700}.driver-tariff-row div{display:grid;grid-template-columns:1fr auto;gap:5px;align-items:center}.driver-tariff-row input{min-width:0}.driver-quick-switch{position:fixed;right:16px;bottom:86px;z-index:30;border:0;border-radius:24px;padding:12px 16px;background:#111;color:#fff;font-weight:800;box-shadow:0 5px 20px #0002}\nhtml[data-moy-taxi-theme="dark"] .driver-settings-page{background:#171717;color:#fff}html[data-moy-taxi-theme="dark"] .driver-settings-page .driver-settings-tabs{border-color:#333}html[data-moy-taxi-theme="dark"] .driver-settings-page .driver-settings-row{border-color:#333}html[data-moy-taxi-theme="dark"] .driver-settings-page .driver-settings-row small{color:#aaa}html[data-moy-taxi-theme="dark"] .driver-settings-page .driver-settings-filter-card{background:#222}html[data-moy-taxi-theme="dark"] .driver-settings-page input,html[data-moy-taxi-theme="dark"] .driver-settings-page select{background:#242424;color:#fff;border-color:#444}html[data-moy-taxi-theme="dark"] .driver-settings-page .driver-settings-choice button{background:#292929;color:#fff}html[data-moy-taxi-theme="dark"] .driver-settings-page .driver-settings-choice button.active{background:#fff;color:#111}\n@media (prefers-color-scheme: dark){html[data-moy-taxi-theme="system"] .driver-settings-page{background:#171717;color:#fff}html[data-moy-taxi-theme="system"] .driver-settings-page .driver-settings-row{border-color:#333}html[data-moy-taxi-theme="system"] .driver-settings-page .driver-settings-filter-card{background:#222}}\n'''
          p.write_text(s+css,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/page.js src/app/globals.css
          git diff --cached --quiet || git commit -m 'Add driver settings matching reference'
          git push
      - name: Remove one-time workflow
        if: success()
        run: |
          git rm .github/workflows/driver-settings.yml
          git commit -m 'Remove one-time settings patch workflow'
          git push
