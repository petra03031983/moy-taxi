   lastNom=Date.now();
   const raw=String(q||'').trim();
   const nomQuery=variants.find(x=>/Косшы|Коянды|Малиновка|Акмол|Талапкер|Лесная поляна/i.test(x))||raw+', Астана, Казахстан';
   try{
     const url='https://nominatim.openstreetmap.org/search?format=geojson&addressdetails=1&namedetails=1&limit=30&countrycodes=kz&accept-language=ru&viewbox=70.15,51.75,72.75,50.30&bounded=1&q='+encodeURIComponent(nomQuery);
     const d=await jsonFetch(url,10000);
     for(const f of d.features||[])appendCandidate(out,parseNominatim(f,nomQuery));
     nearby=rankAndFilter(out,q,pos);
   }catch(e){errors.push(e)}
 }
 if(nearby.length===0){
   for(const x of localFallbacks(q,pos))appendCandidate(out,x);
   nearby=rankAndFilter(out,q,pos);
 }
 if(nearby.length===0&&errors.length>=apiVariants.length+photonVariants.length){
   throw Error('Все поисковые источники временно недоступны');
 }
 return nearby;
}
function render(items){
 $('results').style.display='block';
 if(!items.length){$('results').innerHTML='<div class="message">Рядом с Астаной не найдено точного совпадения. Для «Лесная поляна 16» попробуй вариант «Лесная поляна, 16, Косшы».</div>';return}
 $('results').innerHTML='<div class="reshead">Найдено вариантов: '+items.length+' · Астана и пригород впереди</div>'+items.map((x,i)=>'<div class="item" data-i="'+i+'"><div class="magnify">⌕</div><div class="itembody"><div class="itemtitle">'+esc(x.title)+'</div><div class="itemaddr">'+esc(x.address)+'</div></div><div class="dist">'+(x.distance<1?Math.round(x.distance*1000)+' м':Math.round(x.distance)+' км')+'</div></div>').join('');
 $('results').querySelectorAll('.item').forEach((node,i)=>node.onclick=()=>select(items[i]));
}
function select(x){dest=[x.lat,x.lon];$('query').value=x.title;$('results').style.display='none';$('clear').style.display='block';if(destMarker)map.removeLayer(destMarker);destMarker=L.marker(dest).addTo(map).bindPopup('<b>'+esc(x.title)+'</b><br>'+esc(x.address));destMarker.openPopup();map.setView(dest,17);const d=km(userPos||ASTANA,dest);$('distance').textContent=d<1?Math.round(d*1000)+' м':d.toFixed(1)+' км';$('duration').textContent='— мин';$('build').disabled=false;$('external').disabled=false;$('bottom').style.display='block';$('routecard').style.display='none';stopNav()}
async function buildRoute(){if(!dest||!userPos)return;const btn=$('build');btn.disabled=true;btn.textContent='Строим маршрут…';try{const url='https://router.project-osrm.org/route/v1/driving/'+userPos[1]+','+userPos[0]+';'+dest[1]+','+dest[0]+'?overview=full&geometries=geojson&steps=true',r=await fetch(url);if(!r.ok)throw Error('OSRM '+r.status);const j=await r.json(),rt=j.routes&&j.routes[0];if(!rt||!rt.geometry||!rt.geometry.coordinates.length)throw Error('No route');if(line)map.removeLayer(line);line=L.polyline(rt.geometry.coordinates.map(p=>[p[1],p[0]]),{color:'#167bff',weight:7,opacity:.95,lineJoin:'round'}).addTo(map);map.fitBounds(line.getBounds(),{paddingTopLeft:[30,150],paddingBottomRight:[35,230]});routeSteps=(rt.legs||[]).flatMap(l=>l.steps||[]).map(s=>({instruction:turnText(s),location:s.maneuver&&s.maneuver.location})).filter(s=>s.instruction);stepIndex=0;const mins=Math.round(rt.duration/60),dist=rt.distance/1000;$('distance').textContent=dist.toFixed(1)+' км';$('duration').textContent=mins+' мин';$('routebig').textContent=mins+' мин';$('routedetail').textContent=dist.toFixed(1)+' км · маршрут по дорогам';$('step').textContent=routeSteps[0]&&routeSteps[0].instruction||'Маршрут построен';$('bottom').style.display='none';$('routecard').style.display='block';toast('Маршрут построен по дорожной сети')}catch(e){console.error(e);toast('Не удалось построить маршрут. Попробуй ещё раз или открой навигацию.')}finally{btn.disabled=false;btn.textContent='Построить маршрут'}}
function turnText(s){const m=s.maneuver||{},t=m.type||'',d=m.modifier||'',road=s.name||s.ref||'дорогу';if(t==='arrive')return'Ты прибыл в пункт назначения';if(t==='depart')return'Начни движение по '+road;const words={'left':'поверни налево','right':'поверни направо','slight left':'плавно налево','slight right':'плавно направо','sharp left':'резко налево','sharp right':'резко направо','uturn':'развернись'};if(t==='turn'||t==='end of road'||t==='fork'||t==='on ramp'||t==='off ramp')return(words[d]||'продолжай движение')+' на '+road;return'Продолжай движение по '+road}
function startNav(){if(!dest||!navigator.geolocation){toast('Разреши доступ к GPS для навигации');return}stopNav();const icon=L.divIcon({className:'',html:'<div style="width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;border-bottom:34px solid #167dff;filter:drop-shadow(0 2px 3px #3338)"></div>',iconSize:[28,36],iconAnchor:[14,18]});navArrow=L.marker(userPos||ASTANA,{icon}).addTo(map);navWatch=navigator.geolocation.watchPosition(p=>{userPos=[p.coords.latitude,p.coords.longitude];setUser(userPos,true);if(navArrow)navArrow.setLatLng(userPos);if(dest&&km(userPos,dest)<.05){$('step').textContent='Ты прибыл в пункт назначения';stopNav();return}while(stepIndex<routeSteps.length-1&&routeSteps[stepIndex+1].location&&km(userPos,[routeSteps[stepIndex+1].location[1],routeSteps[stepIndex+1].location[0]])<.08)stepIndex++;if(routeSteps[stepIndex])$('step').textContent=routeSteps[stepIndex].instruction;map.panTo(userPos,{animate:true,duration:.5})},()=>toast('GPS не обновляется. Проверь разрешение геолокации.'),{enableHighAccuracy:true,maximumAge:1000,timeout:10000});$('startnav').textContent='Навигация включена';toast('Навигация включена. Следи за синей линией и подсказкой.')}
function stopNav(){if(navWatch!==null&&navigator.geolocation){navigator.geolocation.clearWatch(navWatch);navWatch=null}if(navArrow&&map&&map.hasLayer(navArrow)){map.removeLayer(navArrow);navArrow=null}if($('startnav'))$('startnav').textContent='▶ В путь'}
function closeRoute(){stopNav();$('routecard').style.display='none';$('bottom').style.display='block';if(line){map.removeLayer(line);line=null}if(destMarker)destMarker.closePopup()}init()})();
</script></body></html>
