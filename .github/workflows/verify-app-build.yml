name: Verify app build and package taxi-only source

on:
  push:
    branches:
      - main
      - moy-taxi-sale-only
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build application
        run: npm run build
      - name: Create source-only ZIP (current tree, no Git history)
        if: (github.ref == 'refs/heads/moy-taxi-sale-only' && github.event_name == 'push') || (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'moy-taxi-sale-only')
        run: |
          git archive --format=zip --prefix=Moy_Taxi_Sale_Package/ HEAD -o Moy_Taxi_Sale_Package.zip
          sha256sum Moy_Taxi_Sale_Package.zip > Moy_Taxi_Sale_Package.zip.sha256
      - name: Upload source-only package
        if: (github.ref == 'refs/heads/moy-taxi-sale-only' && github.event_name == 'push') || (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'moy-taxi-sale-only')
        uses: actions/upload-artifact@v4
        with:
          name: Moy_Taxi_Sale_Package
          path: |
            Moy_Taxi_Sale_Package.zip
            Moy_Taxi_Sale_Package.zip.sha256
          if-no-files-found: error
          retention-days: 30
