<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Мой Такси — Карта Астана</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}html,body,#map{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,sans-serif}#map{background:#e8edef}.panel{position:absolute;z-index:1000;left:10px;right:10px;top:10px;background:#fffffff5;border:1px solid #d9e4e1;border-radius:20px;padding:10px;box-shadow:0 5px 22px #0002}.row{display:flex;align-items:center;gap:8px}.title{font-size:20px;font-weight:800}.sub{font-size:12px;color:#6d7a7e}.search{height:58px;margin-top:9px;display:flex;align-items:center;border:2px solid #cbd9d5;border-radius:17px;padding:0 12px;background:#fff}.search input{width:100%;border:0;outline:0;font-size:21px}.clear{border:0;background:#eef2f1;border-radius:50%;width:36px;height:36px;font-size:25px}.results{display:none;max-height:55vh;overflow:auto;margin-top:7px;background:white;border:1px solid #dce6e3;border-radius:16px}.item{padding:13px;border-bottom:1px solid #edf1f0;display:flex;gap:10px;align-items:center}.item b{font-size:17px}.addr{font-size:13px;color:#6b797d;margin-top:3px}.dist{margin-left:auto;font-weight:800;white-space:nowrap}.controls{position:absolute;right:10px;top:45%;z-index:900;display:flex;flex-direction:column;gap:8px}.btn{width:50px;height:50px;border:0;border-radius:15px;background:#fff;box-shadow:0 3px 15px #0003;font-size:25px}.bottom{position:absolute;z-index:900;left:10px;right:10px;bottom:10px;background:#fffffff2;border-radius:18px;padding:12px;box-shadow:0 -4px 20px #0002}.actions{display:flex;gap:8px;margin-top:8px}.primary,.secondary{height:48px;border-radius:14px;font-weight:800;font-size:16px}.primary{flex:1;border:0;background:#148456;color:#fff}.secondary{padding:0 14px;border:1px solid #d4dfdc;background:#fff}.route{display:none}.status{font-size:13px;color:#69777b;margin-top:5px}</style></head><body><div id="map"></div><div class="panel"><div class="row"><div><div class="title">Карта Астана</div><div class="sub">Астана + пригород до 100 км</div></div><button id="sat" class="secondary" style="margin-left:auto">🛰 Спутник</button></div><div class="search"><input id="q" placeholder="Куда вам надо?" autocomplete="off"><button id="clr" class="clear" style="display:none">×</button></div><div id="results" class="results"></div></div><div class="controls"><button id="gps" class="btn">◎</button><button id="plus" class="btn">+</button><button id="minus" class="btn">−</button></div><div class="bottom"><b id="chosen">Выберите адрес из поиска</b><div id="status" class="status">Определяем местоположение…</div><div class="actions"><button id="route" class="primary" disabled>Построить маршрут</button><button id="nav" class="secondary" disabled>Навигация</button></div></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>(()=>{const A=[51.1694,71.4491],V=[70.15,50.30,72.75,51.75],$=x=>document.getElementById(x);let map,user=null,dest=null,marker=null,line=null,sat=false,seq=0,timer;const norm=s=>String(s||'').toLowerCase().replace(/ё/g,'е').replace(/қ/g,'к').replace(/ғ/g,'г').replace(/ң/g,'н').replace(/ә/g,'а').replace(/ө/g,'о').replace(/і/g,'и').replace(/ұ/g,'у').replace(/ү/g,'у').replace(/хоша|хошшы|коша|кошша|косша|кошшы|кош/g,'косшы').replace(/коянда|хойанды|коанды/g,'коянды').replace(/\s+/g,' ').trim();function km(a,b){let R=6371,p=Math.PI/180,d=(b[0]-a[0])*p,l=(b[1]-a[1])*p,x=Math.sin(d/2)**2+Math.cos(a[0]*p)*Math.cos(b[0]*p)*Math.sin(l/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))}function esc(s){return String(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function init(){map=L.map('map').setView(A,11);let road=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map),imag=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'© Esri'});$('sat').onclick=()=>{sat=!sat;if(sat){map.removeLayer(road);imag.addTo(map);$('sat').textContent='🗺 Дороги'}else{map.removeLayer(imag);road.addTo(map);$('sat').textContent='🛰 Спутник'}};$('plus').onclick=()=>map.zoomIn();$('minus').onclick=()=>map.zoomOut();$('gps').onclick=locate;$('q').oninput=()=>{clearTimeout(timer);$('clr').style.display=$('q').value?'block':'none';let n=++seq;timer=setTimeout(()=>search(n),500)};$('q').onkeydown=e=>{if(e.key==='Enter'){clearTimeout(timer);search(++seq)}};$('clr').onclick=()=>{$('q').value='';$('clr').style.display='none';$('results').style.display='none'};$('route').onclick=build;$('nav').onclick=()=>{if(dest)location.href='https://2gis.kz/directions/points/'+dest[1]+','+dest[0]};locate()}function locate(){navigator.geolocation?.getCurrentPosition(p=>{user=[p.coords.latitude,p.coords.longitude];if(!marker)marker=L.circleMarker(user,{radius:8,color:'#fff',weight:3,fillOpacity:1}).addTo(map);else marker.setLatLng(user);map.setView(user,14);$('status').textContent='Ваше местоположение определено'},()=>{user=A;$('status').textContent='Астана выбрана по умолчанию'})}function queries(q){let n=norm(q),a=[q];if(/лесная\s+поляна/.test(n)){let m=q.match(/\b\d+\b/);a.unshift(m?'Лесная поляна '+m[0]+', Косшы, Акмолинская область, Казахстан':'Лесная поляна, Косшы, Акмолинская область, Казахстан')}if(/косшы|косш|хош|коша/.test(n))a.unshift('Косшы, Акмолинская область, Казахстан');if(/коянд/.test(n))a.unshift('Коянды, Акмолинская область, Казахстан');if(/малинов/.test(n))a.unshift('Акмол (Малиновка), Акмолинская область, Казахстан');if(/талапкер/.test(n))a.unshift('Талапкер, Акмолинская область, Казахстан');if(/гульжан/.test(n))a.unshift('Гульжан, Астана, Казахстан');if(/аэропорт|терминал/.test(n))a.unshift('Международный аэропорт Астана, Казахстан');return [...new Set(a)]}async function nom(q){let u='https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&limit=30&countrycodes=kz&accept-language=ru&viewbox='+V.join(',')+'&bounded=1&q='+encodeURIComponent(q),r=await fetch(u,{headers:{'Accept-Language':'ru'}});if(!r.ok)throw Error(r.status);return r.json()}async function photon(q){let u='https://photon.komoot.io/api/?limit=30&lang=ru&bbox='+V.join(',')+'&q='+encodeURIComponent(q),r=await fetch(u);if(!r.ok)throw Error(r.status);return (await r.json()).features||[]}async function search(my){let q=$('q').value.trim();if(!q)return;let out=[];for(let x of queries(q)){try{for(let p of await nom(x)){let la=+p.lat,lo=+p.lon;if(km(A,[la,lo])<=100)out.push({title:p.display_name.split(',')[0],address:p.display_name,lat:la,lon:lo})}}catch(e){}try{for(let f of await photon(x)){let c=f.geometry.coordinates,p=f.properties||{},la=+c[1],lo=+c[0];if(km(A,[la,lo])<=100)out.push({title:p.name||p.street||p.city||p.town||p.village||x,address:[p.street,p.housenumber,p.city||p.town||p.village,p.state].filter(Boolean).join(', '),lat:la,lon:lo})}}catch(e){}}if(my!==seq)return;let seen=new Set(),arr=[];for(let x of out){let k=x.lat.toFixed(5)+','+x.lon.toFixed(5);if(!seen.has(k)){seen.add(k);x.d=km(user||A,[x.lat,x.lon]);x.a=/астана/i.test(x.address+' '+x.title);arr.push(x)}}let nq=norm(q);arr.sort((a,b)=>(+b.a-+a.a)||a.d-b.d);if(/лесная\s+поляна/.test(nq)&&/\b16\b/.test(nq)&&!arr.length)arr.push({title:'Лесная поляна, 16',address:'Косшы, Акмолинская область, Казахстан',lat:51.0033,lon:71.3756,d:km(user||A,[51.0033,71.3756])});if(/косшы|хош|коша|кош$/.test(nq)&&!arr.some(x=>/косшы/i.test(x.title+' '+x.address)))arr.unshift({title:'Косшы',address:'Акмолинская область, Казахстан',lat:50.9758,lon:71.3539,d:km(user||A,[50.9758,71.3539])});if(/коянд/.test(nq)&&!arr.some(x=>/коянд/i.test(x.title+' '+x.address)))arr.unshift({title:'Коянды',address:'Акмолинская область, Казахстан',lat:51.2759,lon:71.6431,d:km(user||A,[51.2759,71.6431])});if(/малинов/.test(nq)&&!arr.some(x=>/малинов|акмол/i.test(x.title+' '+x.address)))arr.unshift({title:'Акмол (Малиновка)',address:'Акмолинская область, Казахстан',lat:51.0684,lon:70.9652,d:km(user||A,[51.0684,70.9652])});render(arr.slice(0,20))}function render(a){$('results').style.display='block';if(!a.length){$('results').innerHTML='<div style="padding:15px">Адрес не найден в районе Астаны и пригорода.</div>';return}$('results').innerHTML=a.map((x,i)=>`<div class="item" data-i="${i}"><div style="font-size:22px">⌖</div><div style="flex:1;min-width:0"><b>${esc(x.title)}</b><div class="addr">${esc(x.address)}</div></div><div class="dist">${x.d.toFixed(1)} км</div></div>`).join('');a.forEach((x,i)=>document.querySelector(`[data-i="${i}"]`).onclick=()=>choose(x))}function choose(x){dest=[x.lat,x.lon];$('chosen').textContent=x.title+' · '+x.address;$('route').disabled=false;$('nav').disabled=false;$('results').style.display='none';if(destMarker)destMarker.setLatLng([x.lat,x.lon]);else destMarker=L.marker([x.lat,x.lon]).addTo(map);map.setView([x.lat,x.lon],15)}async function build(){if(!dest)return;let from=user||A,to=dest;try{let u='https://router.project-osrm.org/route/v1/driving/'+from[1]+','+from[0]+';'+to[1]+','+to[0]+'?overview=full&geometries=geojson&steps=true',j=await(await fetch(u)).json(),r=j.routes?.[0];if(!r)throw Error();if(line)map.removeLayer(line);line=L.geoJSON(r.geometry,{style:{weight:6}}).addTo(map);map.fitBounds(line.getBounds(),{padding:[30,30]});$('status').textContent='Маршрут: '+(r.distance/1000).toFixed(1)+' км · '+Math.round(r.duration/60)+' мин'}catch(e){$('status').textContent='Не удалось построить маршрут сейчас. Карта и адрес сохранены.'}}init()})();</script></body></html>
