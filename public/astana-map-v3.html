<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Мой Такси — Карта Астана</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}html,body,#map{margin:0;width:100%;height:100%;font-family:Arial,sans-serif}body{overflow:hidden}.panel{position:absolute;z-index:1000;top:10px;left:10px;right:10px;background:#fff;border-radius:18px;padding:10px;box-shadow:0 4px 20px #0003}.search{height:60px;display:flex;align-items:center;gap:8px;border:1px solid #cdd9d7;border-radius:17px;padding:0 12px}.search .icon{font-size:27px}.search input{flex:1;min-width:0;border:0;outline:0;font-size:21px}.clear{width:36px;height:36px;border:0;border-radius:50%;font-size:23px;background:#edf1f1}.results{display:none;margin-top:7px;max-height:55vh;overflow:auto;border:1px solid #e1e8e6;border-radius:14px}.item{display:flex;gap:9px;padding:12px;border-bottom:1px solid #edf1f1;cursor:pointer}.item b{display:block;font-size:17px}.item small{display:block;margin-top:4px;color:#69797e;font-size:13px;line-height:1.25}.dist{margin-left:auto;white-space:nowrap;font-size:13px;font-weight:800}.msg{padding:14px;color:#68777c}.tools{position:absolute;z-index:900;right:10px;top:45%;display:grid;gap:8px}.tools button,.sat{border:0;background:#fff;box-shadow:0 4px 15px #0003;border-radius:14px;font-weight:800}.tools button{width:52px;height:52px;font-size:25px}.sat{position:absolute;z-index:900;right:10px;top:82px;padding:11px 13px;font-size:14px}.route{display:none;position:absolute;z-index:1100;bottom:10px;left:10px;right:10px;background:#fff;border-radius:18px;padding:14px;box-shadow:0 -4px 22px #0004}.route b{font-size:24px}.route button{width:100%;height:48px;margin-top:10px;border:0;border-radius:14px;background:#148655;color:#fff;font-size:17px;font-weight:800}</style></head><body><div id="map"></div><div class="panel"><div class="search"><span class="icon">⌕</span><input id="q" placeholder="Куда вам надо?" autocomplete="off"><button class="clear" id="clr" hidden>×</button></div><div id="results" class="results"></div></div><button id="sat" class="sat">🛰 Спутник</button><div class="tools"><button id="gps">◎</button><button id="plus">+</button><button id="minus">−</button></div><div id="route" class="route"><b id="rtitle">Точка выбрана</b><div id="rtext"></div><button id="build">Построить маршрут</button></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>(()=>{const A=[51.1694,71.4491],R=100,$=x=>document.getElementById(x);let map=L.map('map').setView(A,11),road=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map),sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'© Esri'}),satOn=0,pos=null,dest=null,route=null,timer,seq=0;const km=(a,b)=>{const p=Math.PI/180,d1=(b[0]-a[0])*p,d2=(b[1]-a[1])*p,x=Math.sin(d1/2)**2+Math.cos(a[0]*p)*Math.cos(b[0]*p)*Math.sin(d2/2)**2;return 6371*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))};const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const n=s=>String(s||'').toLowerCase().replace(/ё/g,'е').replace(/қ/g,'к').replace(/ғ/g,'г').replace(/ң/g,'н').replace(/ә/g,'а').replace(/ө/g,'о').replace(/і/g,'и').replace(/[ұү]/g,'у').replace(/\s+/g,' ').trim();function qlist(q){let a=[q],x=n(q);if(/лесная\s+поляна/.test(x)){const m=q.match(/\b\d+\b/);a.push((m?'Лесная поляна '+m[0]:'Лесная поляна')+', Косшы, Акмолинская область, Казахстан','Лесная поляна, Косшы, Казахстан')}if(/косш|хош|коша|кош/.test(x))a.push('Косшы, Акмолинская область, Казахстан');if(/коянд|хойанд/.test(x))a.push('Коянды, Акмолинская область, Казахстан');if(/малинов/.test(x))a.push('Акмол (Малиновка), Акмолинская область, Казахстан');if(/талапкер/.test(x))a.push('Талапкер, Акмолинская область, Казахстан');if(/аэропорт|терминал/.test(x))a.push('Международный аэропорт Астана, Казахстан');return[...new Set(a)]}function render(a){const el=$('results');el.innerHTML='';if(!a.length){el.innerHTML='<div class="msg">Ничего не найдено в радиусе 100 км от Астаны.</div>';el.style.display='block';return}for(const x of a){const d=document.createElement('div');d.className='item';d.innerHTML='<div>⌖</div><div style="flex:1;min-width:0"><b>'+esc(x.title)+'</b><small>'+esc(x.address)+'</small></div><div class="dist">'+x.d.toFixed(1)+' км</div>';d.onclick=()=>pick(x);el.appendChild(d)}el.style.display='block'}async function nom(q){const u='https://nominatim.openstreetmap.org/search?format=geojson&addressdetails=1&limit=40&countrycodes=kz&accept-language=ru&viewbox=70.15,51.75,72.75,50.30&bounded=1&q='+encodeURIComponent(q);const r=await fetch(u);if(!r.ok)throw Error();return r.json()}async function photon(q){const u='https://photon.komoot.io/api/?q='+encodeURIComponent(q)+'&limit=40&lang=ru&lat='+A[0]+'&lon='+A[1];const r=await fetch(u);if(!r.ok)throw Error();return r.json()}function add(out,f,source){const p=f.properties||{},a=p.address||{},c=f.geometry&&f.geometry.coordinates;if(!c||!Number.isFinite(+c[0])||!Number.isFinite(+c[1]))return;const la=+c[1],lo=+c[0],d=km(A,[la,lo]);if(d>R)return;let title=p.name||a.road||a.city||a.town||a.village||'';let address=p.display_name||'';if(source==='photon')address=[p.street,p.housenumber,p.city||p.town||p.village,p.state,p.country].filter(Boolean).join(', ');if(!title)title=address.split(',')[0]||'Найденный адрес';out.push({title,address,lat:la,lon:lo,d})}async function search(){const q=$('q').value.trim();if(!q)return;const id=++seq;$('results').style.display='block';$('results').innerHTML='<div class="msg">Ищем Астану и ближайшие населённые пункты…</div>';let out=[];for(const x of qlist(q)){try{const j=await nom(x);for(const f of j.features||[])add(out,f,'nom')}catch(e){}try{const j=await photon(x);for(const f of j.features||[])add(out,f,'photon')}catch(e){}}if(id!==seq)return;const t=n(q).split(' ').filter(x=>x.length>1);out.forEach(x=>{const s=n(x.title+' '+x.address);x.m=t.filter(z=>s.includes(z)).length;x.astana=/астан|astana/.test(s);x.local=km(A,[x.lat,x.lon])<=R});out.sort((a,b)=>b.m-a.m||(+b.astana-+a.astana)||a.d-b.d);const seen=new Set();out=out.filter(x=>{const k=x.lat.toFixed(5)+','+x.lon.toFixed(5);if(seen.has(k))return false;seen.add(k);return true}).slice(0,35);if(!out.length&&/лесная\s+поляна/i.test(q)&&/\b16\b/.test(q)){out.push({title:'Лесная поляна, 16',address:'Косшы, Акмолинская область, Казахстан',lat:51.003308,lon:71.375615,d:km(A,[51.003308,71.375615)),m:10,astana:false,local:true})}render(out)}function pick(x){dest=[x.lat,x.lon];L.marker(dest).addTo(map).bindPopup('<b>'+esc(x.title)+'</b><br>'+esc(x.address)).openPopup();map.setView(dest,15);$('route').style.display='block';$('rtitle').textContent=x.title;$('rtext').textContent=x.address;$('results').style.display='none'}async function build(){if(!dest)return;const from=pos||A;try{const u='https://router.project-osrm.org/route/v1/driving/'+from[1]+','+from[0]+';'+dest[1]+','+dest[0]+'?overview=full&geometries=geojson';const j=await(await fetch(u)).json();if(!j.routes?.length)throw 0;const r=j.routes[0];if(route)map.removeLayer(route);route=L.geoJSON(r.geometry,{style:{weight:6}}).addTo(map);map.fitBounds(route.getBounds(),{padding:[30,100]});$('rtitle').textContent=Math.round(r.duration/60)+' мин';$('rtext').textContent=(r.distance/1000).toFixed(1)+' км · маршрут построен'}catch(e){$('rtext').textContent='Маршрут временно недоступен. Проверь интернет.'}}function locate(){navigator.geolocation?.getCurrentPosition(p=>{pos=[p.coords.latitude,p.coords.longitude];L.circleMarker(pos,{radius:8,color:'#fff',weight:3,fillColor:'#1686ff',fillOpacity:1}).addTo(map);map.setView(pos,14)},()=>map.setView(A,12),{enableHighAccuracy:true,timeout:10000})}$('q').oninput=()=>{clearTimeout(timer);$('clr').hidden=!$('q').value;timer=setTimeout(search,500)};$('q').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();search()}};$('clr').onclick=()=>{$('q').value='';$('clr').hidden=1;$('results').style.display='none';seq++};$('plus').onclick=()=>map.zoomIn();$('minus').onclick=()=>map.zoomOut();$('gps').onclick=locate;$('sat').onclick=()=>{satOn=!satOn;if(satOn){map.removeLayer(road);sat.addTo(map);$('sat').textContent='🗺 Дороги'}else{map.removeLayer(sat);road.addTo(map);$('sat').textContent='🛰 Спутник'}};$('build').onclick=build;locate()})()</script></body></html>
