<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#f2f5f4"><title>Карта Астана — Мой Такси</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#18272d}#map{position:absolute;inset:0;background:#e8edef}
.top{position:absolute;z-index:900;left:12px;right:12px;top:max(10px,env(safe-area-inset-top));padding:12px;background:#fffffffa;border:1px solid #dae4e2;border-radius:23px;box-shadow:0 8px 25px #18272d26}.head{display:flex;align-items:center;gap:11px;margin-bottom:10px}.logo{width:43px;height:43px;display:grid;place-items:center;background:#148456;color:white;border-radius:14px;font-size:24px;font-weight:850}.brand{font-size:20px;font-weight:850;line-height:1.1}.sub{font-size:13px;color:#6d7c81;margin-top:3px}.toggle{margin-left:auto;border:0;border-radius:13px;background:#e5f4ec;color:#126f4b;font-size:13px;font-weight:800;padding:12px 10px}
.search{height:58px;display:flex;align-items:center;gap:9px;padding:0 12px;border:1.5px solid #ccd9d7;border-radius:19px;background:white}.search svg{width:25px;height:25px;stroke:#68797e;flex:none}.search input{min-width:0;width:100%;font-size:21px;font-weight:500;border:0;outline:0;background:transparent;color:#17272d}.clear{display:none;flex:none;border:0;border-radius:50%;width:36px;height:36px;background:#edf1f1;color:#637278;font-size:26px}
.results{display:none;max-height:48vh;overflow-y:auto;margin-top:8px;border:1px solid #e3e9e8;border-radius:17px;background:#fff;box-shadow:0 5px 16px #18272d1a}.reshead{padding:9px 13px;background:#f6f8f8;color:#65757a;font-size:13px;border-bottom:1px solid #e8eeee}.item{display:flex;gap:10px;align-items:center;padding:12px 10px;border-bottom:1px solid #edf1f1;cursor:pointer}.item:last-child{border-bottom:0}.magnify{width:27px;flex:none;color:#93a0a3;font-size:23px;text-align:center}.itembody{min-width:0;flex:1}.itemtitle{font-size:16px;font-weight:750;line-height:1.25}.itemaddr{font-size:13px;color:#718087;line-height:1.3;margin-top:4px}.dist{font-size:13px;font-weight:800;color:#4e6268;white-space:nowrap}.message{padding:15px;color:#6a797e;font-size:15px;line-height:1.4}
.controls{position:absolute;z-index:700;right:12px;top:47%;display:flex;flex-direction:column;gap:10px}.mapbtn{width:52px;height:52px;background:#fff;border:0;border-radius:17px;box-shadow:0 4px 16px #18272d2b;font-size:26px;font-weight:650;color:#2e4148}.bottom{position:absolute;z-index:800;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));padding:14px;background:#fffffffa;border:1px solid #e1e8e6;border-radius:23px;box-shadow:0 -5px 24px #18272d1b}.bottom h2{margin:0;font-size:21px;font-weight:850}.muted{font-size:14px;color:#728086;margin-top:5px;line-height:1.3}.metrics{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:11px}.metric{min-width:0;padding:9px;background:#f4f7f7;border:1px solid #e7eceb;border-radius:14px}.metric span{display:block;color:#76858a;font-size:12px}.metric b{display:block;font-size:17px;margin-top:3px}.actions{display:flex;gap:9px;margin-top:11px}.primary,.secondary{min-height:48px;border-radius:15px;font-size:16px;font-weight:800}.primary{flex:1;border:0;color:#fff;background:#138655}.primary:disabled{background:#a5cdbc;color:#fff}.secondary{padding:0 13px;background:white;border:1px solid #dce4e2;color:#283a40}.routecard{display:none;position:absolute;z-index:950;bottom:max(12px,env(safe-area-inset-bottom));left:12px;right:12px;background:white;padding:15px;border-radius:23px;box-shadow:0 -5px 25px #18272d30}.routehead{display:flex;align-items:center;justify-content:space-between}.routebig{font-size:25px;font-weight:850}.routedetail{font-size:14px;color:#65767c;margin-top:3px}.step{margin-top:12px;padding:11px 12px;border-radius:14px;background:#f1f6f4;font-size:16px;font-weight:700;line-height:1.35}.toast{display:none;position:absolute;z-index:1000;top:150px;left:20px;right:20px;padding:13px 15px;background:#192a30;color:white;border-radius:15px;font-size:15px;box-shadow:0 5px 20px #0002}.leaflet-control-attribution{font-size:9px!important}.leaflet-control-zoom{display:none!important}
@media(min-width:700px){.top{left:24px;right:auto;width:530px}.bottom,.routecard{left:24px;right:auto;width:530px}.controls{right:24px}}
</style></head><body><div id="map"></div>
<section class="top"><div class="head"><div class="logo">↗</div><div><div class="brand">Карта Астана</div><div class="sub">Астана · ближайшие посёлки · маршруты</div></div><button class="toggle" id="layer">🛰 Спутник</button></div><div class="search"><svg viewBox="0 0 24 24" fill="none"><circle cx="10.8" cy="10.8" r="7.1" stroke-width="2"/><path d="m16 16 5 5" stroke-width="2"/></svg><input id="query" placeholder="Поиск адреса или места" autocomplete="off" enterkeyhint="search"><button id="clear" class="clear" aria-label="Очистить">×</button></div><div class="results" id="results"></div></section>
<div class="controls"><button id="gps" class="mapbtn" aria-label="Моё местоположение">◎</button><button id="plus" class="mapbtn">+</button><button id="minus" class="mapbtn">−</button></div>
<section class="bottom" id="bottom"><h2>Астана и пригород</h2><div class="muted" id="gpsstatus">Определяем местоположение…</div><div class="metrics"><div class="metric"><span>Расстояние</span><b id="distance">— км</b></div><div class="metric"><span>Время</span><b id="duration">— мин</b></div><div class="metric"><span>Карта</span><b id="maptype">Дорожная</b></div></div><div class="actions"><button id="build" class="primary" disabled>Построить маршрут</button><button id="external" class="secondary" disabled>Навигация</button></div><div class="muted">Выбери адрес из списка — маршрут будет показан прямо здесь.</div></section>
<section class="routecard" id="routecard"><div class="routehead"><div><div id="routebig" class="routebig">— мин</div><div id="routedetail" class="routedetail">— км · маршрут</div></div><button class="secondary" id="close">Закрыть</button></div><div id="step" class="step">Маршрут построен</div><div class="actions"><button id="startnav" class="primary">▶ В путь</button><button id="stopnav" class="secondary">Остановить</button></div></section><div class="toast" id="toast"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
(()=>{'use strict';const ASTANA=[51.1694,71.4491],$=id=>document.getElementById(id);let map,road,satellite,userPos=null,userMarker=null,dest=null,destMarker=null,line=null,navWatch=null,navArrow=null,routeSteps=[],stepIndex=0,satOn=false,searchTimer=0,lastNom=0;
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(s){$('toast').textContent=s;$('toast').style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').style.display='none',3600)}function km(a,b){const R=6371,la=(b[0]-a[0])*Math.PI/180,lo=(b[1]-a[1])*Math.PI/180,x=Math.sin(la/2)**2+Math.cos(a[0]*Math.PI/180)*Math.cos(b[0]*Math.PI/180)*Math.sin(lo/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))}
function init(){if(!window.L){toast('Карта не загрузилась. Проверь интернет и обнови страницу.');return}map=L.map('map',{zoomControl:false}).setView(ASTANA,12);road=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);satellite=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Tiles © Esri'});$('plus').onclick=()=>map.zoomIn();$('minus').onclick=()=>map.zoomOut();$('gps').onclick=locate;$('layer').onclick=()=>{satOn=!satOn;if(satOn){map.removeLayer(road);satellite.addTo(map);$('layer').textContent='🗺 Дороги';$('maptype').textContent='Спутник'}else{map.removeLayer(satellite);road.addTo(map);$('layer').textContent='🛰 Спутник';$('maptype').textContent='Дорожная'}};$('query').addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(search,400);$('clear').style.display=$('query').value?'block':'none'});$('query').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();search()}});$('clear').onclick=()=>{$('query').value='';$('clear').style.display='none';$('results').style.display='none';$('query').focus()};$('build').onclick=buildRoute;$('external').onclick=()=>{if(dest)location.href='https://2gis.kz/directions/points/'+(userPos?userPos[1]+','+userPos[0]:'')+';'+dest[1]+','+dest[0]};$('close').onclick=closeRoute;$('startnav').onclick=startNav;$('stopnav').onclick=stopNav;locate()}
function locate(){if(!navigator.geolocation){userPos=ASTANA;setUser(ASTANA,false);return}navigator.geolocation.getCurrentPosition(p=>{userPos=[p.coords.latitude,p.coords.longitude];setUser(userPos,true)},()=>{if(!userPos){userPos=ASTANA;setUser(ASTANA,false);$('gpsstatus').textContent='GPS недоступен · карта открыта на Астане'}},{enableHighAccuracy:true,timeout:10000,maximumAge:15000})}
function setUser(pos,real){if(!map)return;if(!userMarker)userMarker=L.circleMarker(pos,{radius:8,color:'#fff',weight:3,fillColor:'#1686ff',fillOpacity:1}).addTo(map).bindTooltip('Моё местоположение');else userMarker.setLatLng(pos);if(!dest)map.setView(pos,14);$('gpsstatus').textContent=real?'GPS определён. Расстояние считается от тебя.':'Показана Астана; разреши доступ к GPS для точного расстояния.'}
function status(s){$('results').style.display='block';$('results').innerHTML='<div class="message">'+esc(s)+'</div>'}
function feature(f){const p=f.properties||{},xy=f.geometry&&f.geometry.coordinates;if(!xy||!Number.isFinite(+xy[0])||!Number.isFinite(+xy[1]))return null;const city=p.city||p.town||p.village||p.municipality||p.county||p.state||'',street=p.street||p.name||p.locality||'',num=p.housenumber||'',title=p.name||[street,num].filter(Boolean).join(' ')||p.locality||p.city||p.town||p.village||'';return{title:title||'Найденный адрес',address:[street&&street!==title?street:null,num&&!street?num:null,city,p.state,p.country].filter(Boolean).join(', ')||p.label||'',lat:+xy[1],lon:+xy[0]}}
function astana(x){return /астан|astana|нур-султан|nur-sultan/i.test((x.address||'')+' '+(x.title||''))}
function search(){const q=$('query').value.trim();if(!q){$('results').style.display='none';return}status('Ищем варианты адреса…');geocode(q).then(a=>render(a)).catch(()=>status('Поиск временно не ответил. Попробуй ещё раз.'))}
async function geocode(q){const pos=userPos||ASTANA,all=[];let fail=false;try{const r=await fetch('https://photon.komoot.io/api/?limit=40&lang=ru&lat='+pos[0]+'&lon='+pos[1]+'&q='+encodeURIComponent(q));if(!r.ok)throw Error('Photon '+r.status);const j=await r.json();for(const f of j.features||[]){const x=feature(f);if(x)all.push(x)}}catch(e){fail=true;console.warn(e)}if((fail||!all.some(astana))&&Date.now()-lastNom>1100){lastNom=Date.now();try{const r=await fetch('https://nominatim.openstreetmap.org/search?format=geojson&addressdetails=1&limit=35&countrycodes=kz&accept-language=ru&q='+encodeURIComponent(q),{headers:{'Accept-Language':'ru'}});if(!r.ok)throw Error('Nominatim '+r.status);const j=await r.json();for(const f of j.features||[]){const p=f.properties||{},a=p.address||{},xy=f.geometry&&f.geometry.coordinates;if(!xy||!Number.isFinite(+xy[0])||!Number.isFinite(+xy[1]))continue;const title=p.name||a.amenity||a.shop||a.building||a.road||String(p.display_name||q).split(',')[0];all.push({title,address:p.display_name||[a.road,a.house_number,a.city||a.town||a.village,a.state].filter(Boolean).join(', '),lat:+xy[1],lon:+xy[0]})}}catch(e){console.warn(e)}}const seen=new Set(),out=[];for(const x of all){const k=x.lat.toFixed(5)+','+x.lon.toFixed(5);if(seen.has(k))continue;seen.add(k);x.distance=km(pos,[x.lat,x.lon]);x.inAstana=astana(x);x.near=x.distance<=100;out.push(x)}out.sort((a,b)=>(+b.inAstana-+a.inAstana)||(+b.near-+a.near)||a.distance-b.distance);return out.slice(0,35)}
function render(items){$('results').style.display='block';if(!items.length){$('results').innerHTML='<div class="message">Совпадений не найдено. Попробуй название места, улицу и номер дома.</div>';return}$('results').innerHTML='<div class="reshead">Найдено вариантов: '+items.length+' · сначала Астана, затем ближайшие места</div>'+items.map((x,i)=>'<div class="item" data-i="'+i+'"><div class="magnify">⌕</div><div class="itembody"><div class="itemtitle">'+esc(x.title)+'</div><div class="itemaddr">'+esc(x.address)+'</div></div><div class="dist">'+(x.distance<1?Math.round(x.distance*1000)+' м':Math.round(x.distance)+' км')+'</div></div>').join('');$('results').querySelectorAll('.item').forEach((n,i)=>n.onclick=()=>select(items[i]))}
function select(x){dest=[x.lat,x.lon];$('query').value=x.title;$('results').style.display='none';$('clear').style.display='block';if(destMarker)map.removeLayer(destMarker);destMarker=L.marker(dest).addTo(map).bindPopup('<b>'+esc(x.title)+'</b><br>'+esc(x.address));destMarker.openPopup();map.setView(dest,17);const d=km(userPos||ASTANA,dest);$('distance').textContent=d<1?Math.round(d*1000)+' м':d.toFixed(1)+' км';$('duration').textContent='— мин';$('build').disabled=false;$('external').disabled=false;$('bottom').style.display='block';$('routecard').style.display='none';stopNav()}
async function buildRoute(){if(!dest||!userPos)return;const btn=$('build');btn.disabled=true;btn.textContent='Строим маршрут…';try{const url='https://router.project-osrm.org/route/v1/driving/'+userPos[1]+','+userPos[0]+';'+dest[1]+','+dest[0]+'?overview=full&geometries=geojson&steps=true',r=await fetch(url);if(!r.ok)throw Error('OSRM '+r.status);const j=await r.json(),rt=j.routes&&j.routes[0];if(!rt||!rt.geometry||!rt.geometry.coordinates.length)throw Error('No route');if(line)map.removeLayer(line);line=L.polyline(rt.geometry.coordinates.map(p=>[p[1],p[0]]),{color:'#167bff',weight:7,opacity:.95,lineJoin:'round'}).addTo(map);map.fitBounds(line.getBounds(),{paddingTopLeft:[30,150],paddingBottomRight:[35,230]});routeSteps=(rt.legs||[]).flatMap(l=>l.steps||[]).map(s=>({instruction:turnText(s),location:s.maneuver&&s.maneuver.location})).filter(s=>s.instruction);stepIndex=0;const mins=Math.round(rt.duration/60),dist=rt.distance/1000;$('distance').textContent=dist.toFixed(1)+' км';$('duration').textContent=mins+' мин';$('routebig').textContent=mins+' мин';$('routedetail').textContent=dist.toFixed(1)+' км · маршрут по дорогам';$('step').textContent=routeSteps[0]&&routeSteps[0].instruction||'Маршрут построен';$('bottom').style.display='none';$('routecard').style.display='block';toast('Маршрут построен по дорожной сети')}catch(e){console.error(e);toast('Не удалось построить маршрут. Попробуй ещё раз или открой навигацию.')}finally{btn.disabled=false;btn.textContent='Построить маршрут'}}
function turnText(s){const m=s.maneuver||{},t=m.type||'',d=m.modifier||'',road=s.name||s.ref||'дорогу';if(t==='arrive')return'Ты прибыл в пункт назначения';if(t==='depart')return'Начни движение по '+road;const words={'left':'поверни налево','right':'поверни направо','slight left':'плавно налево','slight right':'плавно направо','sharp left':'резко налево','sharp right':'резко направо','uturn':'развернись'};if(t==='turn'||t==='end of road'||t==='fork'||t==='on ramp'||t==='off ramp')return(words[d]||'продолжай движение')+' на '+road;return'Продолжай движение по '+road}
function startNav(){if(!dest||!navigator.geolocation){toast('Разреши доступ к GPS для навигации');return}stopNav();const icon=L.divIcon({className:'',html:'<div style="width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;border-bottom:34px solid #167dff;filter:drop-shadow(0 2px 3px #3338)"></div>',iconSize:[28,36],iconAnchor:[14,18]});navArrow=L.marker(userPos||ASTANA,{icon}).addTo(map);navWatch=navigator.geolocation.watchPosition(p=>{userPos=[p.coords.latitude,p.coords.longitude];setUser(userPos,true);if(navArrow)navArrow.setLatLng(userPos);if(dest&&km(userPos,dest)<.05){$('step').textContent='Ты прибыл в пункт назначения';stopNav();return}while(stepIndex<routeSteps.length-1&&routeSteps[stepIndex+1].location&&km(userPos,[routeSteps[stepIndex+1].location[1],routeSteps[stepIndex+1].location[0]])<.08)stepIndex++;if(routeSteps[stepIndex])$('step').textContent=routeSteps[stepIndex].instruction;map.panTo(userPos,{animate:true,duration:.5})},()=>toast('GPS не обновляется. Проверь разрешение геолокации.'),{enableHighAccuracy:true,maximumAge:1000,timeout:10000});$('startnav').textContent='Навигация включена';toast('Навигация включена. Следи за синей линией и подсказкой.')}
function stopNav(){if(navWatch!==null&&navigator.geolocation){navigator.geolocation.clearWatch(navWatch);navWatch=null}if(navArrow&&map&&map.hasLayer(navArrow)){map.removeLayer(navArrow);navArrow=null}if($('startnav'))$('startnav').textContent='▶ В путь'}
function closeRoute(){stopNav();$('routecard').style.display='none';$('bottom').style.display='block';if(line){map.removeLayer(line);line=null}if(destMarker)destMarker.closePopup()}init()})();
</script></body></html>
