<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#f2f5f4"><title>Карта Астана — Мой Такси</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}html,body,#map{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#18272d}#map{position:absolute;inset:0;background:#e8edef}.top{position:absolute;z-index:900;left:12px;right:12px;top:max(10px,env(safe-area-inset-top));padding:12px;background:#fffffffa;border:1px solid #dae4e2;border-radius:23px;box-shadow:0 8px 25px #18272d26}.head{display:flex;align-items:center;gap:10px;margin-bottom:10px}.logo{width:43px;height:43px;display:grid;place-items:center;background:#148456;color:white;border-radius:14px;font-size:24px;font-weight:850}.brand{font-size:20px;font-weight:850;line-height:1.1}.sub{font-size:13px;color:#6d7c81;margin-top:3px}.toggle{margin-left:auto;border:0;border-radius:13px;background:#e5f4ec;color:#126f4b;font-size:13px;font-weight:800;padding:12px 10px}.search{height:62px;display:flex;align-items:center;gap:9px;padding:0 13px;border:1.5px solid #ccd9d7;border-radius:19px;background:white}.search svg{width:27px;height:27px;stroke:#68797e;flex:none}.search input{min-width:0;width:100%;font-size:22px;font-weight:500;border:0;outline:0;background:transparent;color:#17272d}.clear{display:none;flex:none;border:0;border-radius:50%;width:38px;height:38px;background:#edf1f1;color:#637278;font-size:27px}.results{display:none;max-height:55vh;overflow-y:auto;margin-top:8px;border:1px solid #e3e9e8;border-radius:17px;background:#fff;box-shadow:0 5px 16px #18272d1a}.reshead{padding:9px 13px;background:#f6f8f8;color:#65757a;font-size:13px;border-bottom:1px solid #e8eeee}.item{display:flex;gap:9px;align-items:center;padding:13px 10px;border-bottom:1px solid #edf1f1;cursor:pointer}.magnify{width:27px;flex:none;color:#93a0a3;font-size:23px;text-align:center}.itembody{min-width:0;flex:1}.itemtitle{font-size:17px;font-weight:750;line-height:1.25}.itemaddr{font-size:13px;color:#718087;line-height:1.3;margin-top:4px}.dist{font-size:13px;font-weight:800;color:#4e6268;white-space:nowrap}.message{padding:15px;color:#6a797e;font-size:15px;line-height:1.4}.controls{position:absolute;z-index:700;right:12px;top:47%;display:flex;flex-direction:column;gap:10px}.mapbtn{width:54px;height:54px;background:#fff;border:0;border-radius:17px;box-shadow:0 4px 16px #18272d2b;font-size:27px;font-weight:650;color:#2e4148}.bottom{position:absolute;z-index:800;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));padding:14px;background:#fffffffa;border:1px solid #e1e8e6;border-radius:23px;box-shadow:0 -5px 24px #18272d1b}.bottom h2{margin:0;font-size:21px;font-weight:850}.muted{font-size:14px;color:#728086;margin-top:5px;line-height:1.3}.metrics{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:11px}.metric{min-width:0;padding:9px;background:#f4f7f7;border:1px solid #e7eceb;border-radius:14px}.metric span{display:block;color:#76858a;font-size:12px}.metric b{display:block;font-size:17px;margin-top:3px}.actions{display:flex;gap:9px;margin-top:11px}.primary,.secondary{min-height:49px;border-radius:15px;font-size:16px;font-weight:800}.primary{flex:1;border:0;color:#fff;background:#138655}.primary:disabled{background:#a5cdbc}.secondary{padding:0 13px;background:white;border:1px solid #dce4e2;color:#283a40}.routecard{display:none;position:absolute;z-index:950;bottom:max(12px,env(safe-area-inset-bottom));left:12px;right:12px;background:white;padding:15px;border-radius:23px;box-shadow:0 -5px 25px #18272d30}.routehead{display:flex;align-items:center;justify-content:space-between}.routebig{font-size:25px;font-weight:850}.routedetail{font-size:14px;color:#65767c;margin-top:3px}.step{margin-top:12px;padding:11px 12px;border-radius:14px;background:#f1f6f4;font-size:16px;font-weight:700;line-height:1.35}.toast{display:none;position:absolute;z-index:1000;top:150px;left:20px;right:20px;padding:13px 15px;background:#192a30;color:white;border-radius:15px;font-size:15px;box-shadow:0 5px 20px #0002}.leaflet-control-attribution{font-size:9px!important}.leaflet-control-zoom{display:none!important}@media(min-width:700px){.top{left:24px;right:auto;width:530px}.bottom,.routecard{left:24px;right:auto;width:530px}.controls{right:24px}}</style></head><body><div id="map"></div><section class="top"><div class="head"><div class="logo">↗</div><div><div class="brand">Карта Астана</div><div class="sub">Астана · ближайшие посёлки · маршруты</div></div><button class="toggle" id="layer">🛰 Спутник</button></div><div class="search"><svg viewBox="0 0 24 24" fill="none"><circle cx="10.8" cy="10.8" r="7.1" stroke-width="2"/><path d="m16 16 5 5" stroke-width="2"/></svg><input id="query" placeholder="Поиск адреса или места" autocomplete="off" enterkeyhint="search"><button id="clear" class="clear" aria-label="Очистить">×</button></div><div class="results" id="results"></div></section><div class="controls"><button id="gps" class="mapbtn">◎</button><button id="plus" class="mapbtn">+</button><button id="minus" class="mapbtn">−</button></div><section class="bottom" id="bottom"><h2>Астана и пригород</h2><div class="muted" id="gpsstatus">Определяем местоположение…</div><div class="metrics"><div class="metric"><span>Расстояние</span><b id="distance">— км</b></div><div class="metric"><span>Время</span><b id="duration">— мин</b></div><div class="metric"><span>Карта</span><b id="maptype">Дорожная</b></div></div><div class="actions"><button id="build" class="primary" disabled>Построить маршрут</button><button id="external" class="secondary" disabled>Навигация</button></div><div class="muted">Выбери адрес из списка — маршрут будет показан прямо здесь.</div></section><section class="routecard" id="routecard"><div class="routehead"><div><div id="routebig" class="routebig">— мин</div><div id="routedetail" class="routedetail">— км · маршрут</div></div><button class="secondary" id="close">Закрыть</button></div><div id="step" class="step">Маршрут построен</div><div class="actions"><button id="startnav" class="primary">▶ В путь</button><button id="stopnav" class="secondary">Остановить</button></div></section><div class="toast" id="toast"></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>(()=>{'use strict';const ASTANA=[51.1694,71.4491],BOX='70.15,50.30,72.75,51.75',$=id=>document.getElementById(id);let map,road,satellite,userPos=null,userMarker=null,dest=null,destMarker=null,line=null,navWatch=null,navArrow=null,routeSteps=[],stepIndex=0,satOn=false,timer=0;const aliases=[['хоша','косшы'],['коша','косшы'],['кош','косшы'],['косши','косшы'],['коянда','коянды'],['малиновка','арнасай']];function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(s){$('toast').textContent=s;$('toast').style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').style.display='none',3600)}function km(a,b){const R=6371,la=(b[0]-a[0])*Math.PI/180,lo=(b[1]-a[1])*Math.PI/180,x=Math.sin(la/2)**2+Math.cos(a[0]*Math.PI/180)*Math.cos(b[0]*Math.PI/180)*Math.sin(lo/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))}function init(){map=L.map('map',{zoomControl:false}).setView(ASTANA,12);road=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);satellite=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Tiles © Esri'});$('plus').onclick=()=>map.zoomIn();$('minus').onclick=()=>map.zoomOut();$('gps').onclick=locate;$('layer').onclick=()=>{satOn=!satOn;if(satOn){map.removeLayer(road);satellite.addTo(map);$('layer').textContent='🗺 Дороги';$('maptype').textContent='Спутник'}else{map.removeLayer(satellite);road.addTo(map);$('layer').textContent='🛰 Спутник';$('maptype').textContent='Дорожная'}};$('query').addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(search,450);$('clear').style.display=$('query').value?'block':'none'});$('query').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();search()}});$('clear').onclick=()=>{$('query').value='';$('clear').style.display='none';$('results').style.display='none';$('query').focus()};$('build').onclick=buildRoute;$('external').onclick=()=>{if(dest)location.href='https://2gis.kz/directions/points/'+(userPos?userPos[1]+','+userPos[0]:'')+';'+dest[1]+','+dest[0]};$('close').onclick=closeRoute;$('startnav').onclick=startNav;$('stopnav').onclick=stopNav;locate()}function locate(){if(!navigator.geolocation){userPos=ASTANA;setUser(ASTANA,false);return}navigator.geolocation.getCurrentPosition(p=>{userPos=[p.coords.latitude,p.coords.longitude];setUser(userPos,true)},()=>{userPos=ASTANA;setUser(ASTANA,false)},{enableHighAccuracy:true,timeout:10000,maximumAge:15000})}function setUser(pos,real){if(!userMarker)userMarker=L.circleMarker(pos,{radius:8,color:'#fff',weight:3,fillColor:'#1686ff',fillOpacity:1}).addTo(map);else userMarker.setLatLng(pos);if(!dest)map.setView(pos,14);$('gpsstatus').textContent=real?'GPS определён. Расстояние считается от текущей точки.':'Астана выбрана по умолчанию. Разреши GPS для точного расстояния.'}function status(s){$('results').style.display='block';$('results').innerHTML='<div class="message">'+esc(s)+'</div>'}function norm(q){let s=q.toLowerCase().replace(/ё/g,'е').trim();for(const [a,b] of aliases)s=s.replace(new RegExp('\\b'+a+'\\b','gi'),b);return s}function titleOf(p,a,q){return p.name||a.amenity||a.shop||a.tourism||a.building||a.road||a.neighbourhood||a.suburb||a.city||a.town||a.village||q}function addNom(j,out){for(const f of j.features||[]){const p=f.properties||{},a=p.address||{},xy=f.geometry&&f.geometry.coordinates;if(!xy||!Number.isFinite(+xy[0])||!Number.isFinite(+xy[1]))continue;out.push({title:titleOf(p,a,p.display_name),address:p.display_name||'',lat:+xy[1],lon:+xy[0]})}}async function nom(q,bounded){const u='https://nominatim.openstreetmap.org/search?format=geojson&addressdetails=1&limit=40&countrycodes=kz&accept-language=ru&q='+encodeURIComponent(q)+(bounded?'&viewbox='+BOX+'&bounded=1':'');const r=await fetch(u,{headers:{'Accept-Language':'ru'}});if(!r.ok)throw Error('Nominatim '+r.status);return r.json()}async function photon(q){const u='https://photon.komoot.io/api/?limit=40&lang=ru&bbox='+BOX+'&lat='+ASTANA[0]+'&lon='+ASTANA[1]+'&q='+encodeURIComponent(q);const r=await fetch(u);if(!r.ok)throw Error('Photon '+r.status);return r.json()}async function geocode(q){const pos=userPos||ASTANA,queries=[q,norm(q)];if(/лесная\s+поляна/i.test(q))queries.push(q+', Косшы, Акмолинская область');if(/^(коянд|коянд[а-я]*)$/i.test(q))queries.push('Коянды, Акмолинская область');if(/малинов/i.test(q))queries.push('Малиновка, Акмолинская область');if(/косш|кош/i.test(q))queries.push('Косшы, Акмолинская область');const unique=[...new Set(queries.map(x=>x.trim()).filter(Boolean))],out=[];for(const qx of unique){try{addNom(await nom(qx,true),out)}catch(e){console.warn(e)}try{const j=await photon(qx);for(const f of j.features||[]){const p=f.properties||{},xy=f.geometry&&f.geometry.coordinates;if(!xy)continue;out.push({title:p.name||p.street||p.city||p.town||p.village||qx,address:[p.street,p.housenumber,p.city||p.town||p.village,p.state,p.country].filter(Boolean).join(', '),lat:+xy[1],lon:+xy[0]})}}catch(e){console.warn(e)}}if(out.length<2){for(const qx of unique.slice(0,3)){try{addNom(await nom(qx,false),out)}catch(e){console.warn(e)}}}const seen=new Set(),arr=[];for(const x of out){if(!Number.isFinite(x.lat)||!Number.isFinite(x.lon))continue;const k=x.lat.toFixed(5)+','+x.lon.toFixed(5);if(seen.has(k))continue;seen.add(k);x.distance=km(pos,[x.lat,x.lon]);const text=(x.title+' '+x.address).toLowerCase();x.astana=/астан|astana/.test(text);x.local=x.distance<=100;arr.push(x)}arr.sort((a,b)=>(+b.astana-+a.astana)||(+b.local-+a.local)||a.distance-b.distance);return arr.slice(0,40)}function search(){const q=$('query').value.trim();if(!q){$('results').style.display='none';return}status('Ищем адреса рядом с Астаной…');geocode(q).then(render).catch(e=>{console.error(e);status('Поиск временно недоступен. Проверь интернет и попробуй ещё раз.')})}function render(items){$('results').style.display='block';if(!items.length){$('results').innerHTML='<div class="message">Адрес не найден. Попробуй улицу и номер дома или название посёлка.</div>';return}$('results').innerHTML='<div class="reshead">Найдено: '+items.length+' · сначала Астана и пригород</div>'+items.map((x,i)=>'<div class="item"><div class="magnify">⌕</div><div class="itembody"><div class="itemtitle">'+esc(x.title)+'</div><div class="itemaddr">'+esc(x.address)+'</div></div><div class="dist">'+(x.distance<1?Math.round(x.distance*1000)+' м':Math.round(x.distance)+' км')+'</div></div>').join('');$('results').querySelectorAll('.item').forEach((n,i)=>n.onclick=()=>select(items[i]))}function select(x){dest=[x.lat,x.lon];$('query').value=x.title;$('results').style.display='none';$('clear').style.display='block';if(destMarker)map.removeLayer(destMarker);destMarker=L.marker(dest).addTo(map).bindPopup('<b>'+esc(x.title)+'</b><br>'+esc(x.address));destMarker.openPopup();map.setView(dest,17);const d=km(userPos||ASTANA,dest);$('distance').textContent=d<1?Math.round(d*1000)+' м':d.toFixed(1)+' км';$('duration').textContent='— мин';$('build').disabled=false;$('external').disabled=false;$('bottom').style.display='block';$('routecard').style.display='none';stopNav()}async function buildRoute(){if(!dest)return;const start=userPos||ASTANA,btn=$('build');btn.disabled=true;btn.textContent='Строим маршрут…';try{const r=await fetch('https://router.project-osrm.org/route/v1/driving/'+start[1]+','+start[0]+';'+dest[1]+','+dest[0]+'?overview=full&geometries=geojson&steps=true');if(!r.ok)throw Error('OSRM '+r.status);const j=await r.json(),rt=j.routes&&j.routes[0];if(!rt)throw Error('No route');if(line)map.removeLayer(line);line=L.polyline(rt.geometry.coordinates.map(p=>[p[1],p[0]]),{color:'#167bff',weight:8,opacity:.95,lineJoin:'round'}).addTo(map);map.fitBounds(line.getBounds(),{paddingTopLeft:[30,170],paddingBottomRight:[35,250]});routeSteps=(rt.legs||[]).flatMap(l=>l.steps||[]).map(s=>({instruction:turnText(s),location:s.maneuver&&s.maneuver.location})).filter(s=>s.instruction);stepIndex=0;const mins=Math.max(1,Math.round(rt.duration/60)),dist=rt.distance/1000;$('distance').textContent=dist.toFixed(1)+' км';$('duration').textContent=mins+' мин';$('routebig').textContent=mins+' мин';$('routedetail').textContent=dist.toFixed(1)+' км · маршрут по дорогам';$('step').textContent=routeSteps[0]?.instruction||'Маршрут построен';$('bottom').style.display='none';$('routecard').style.display='block'}catch(e){console.error(e);toast('Не удалось построить маршрут. Проверь интернет.')}finally{btn.disabled=false;btn.textContent='Построить маршрут'}}function turnText(s){const m=s.maneuver||{},t=m.type||'',d=m.modifier||'',road=s.name||s.ref||'дорогу',w={'left':'поверни налево','right':'поверни направо','slight left':'плавно налево','slight right':'плавно направо','sharp left':'резко налево','sharp right':'резко направо','uturn':'развернись'};if(t==='arrive')return'Ты прибыл в пункт назначения';if(t==='depart')return'Начни движение по '+road;if(['turn','end of road','fork','on ramp','off ramp'].includes(t))return(w[d]||'продолжай движение')+' на '+road;return'Продолжай движение по '+road}function startNav(){if(!dest||!navigator.geolocation){toast('Разреши доступ к GPS для навигации');return}stopNav();const icon=L.divIcon({className:'',html:'<div style="width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;border-bottom:34px solid #167dff;filter:drop-shadow(0 2px 3px #3338)"></div>',iconSize:[28,36],iconAnchor:[14,18]});navArrow=L.marker(userPos||ASTANA,{icon}).addTo(map);navWatch=navigator.geolocation.watchPosition(p=>{userPos=[p.coords.latitude,p.coords.longitude];setUser(userPos,true);if(navArrow)navArrow.setLatLng(userPos);if(dest&&km(userPos,dest)<.05){$('step').textContent='Ты прибыл в пункт назначения';stopNav();return}while(stepIndex<routeSteps.length-1&&routeSteps[stepIndex+1].location&&km(userPos,[routeSteps[stepIndex+1].location[1],routeSteps[stepIndex+1].location[0]])<.08)stepIndex++;if(routeSteps[stepIndex])$('step').textContent=routeSteps[stepIndex].instruction;map.panTo(userPos,{animate:true,duration:.5})},()=>toast('GPS не обновляется. Проверь разрешение геолокации.'),{enableHighAccuracy:true,maximumAge:1000,timeout:10000});$('startnav').textContent='Навигация включена'}function stopNav(){if(navWatch!==null&&navigator.geolocation){navigator.geolocation.clearWatch(navWatch);navWatch=null}if(navArrow&&map&&map.hasLayer(navArrow)){map.removeLayer(navArrow);navArrow=null}if($('startnav'))$('startnav').textContent='▶ В путь'}function closeRoute(){stopNav();$('routecard').style.display='none';$('bottom').style.display='block';if(line){map.removeLayer(line);line=null}if(destMarker)destMarker.closePopup()}init()})();</script></body></html>
